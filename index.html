<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión - Protección Civil</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <main class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h2>Protección Civil</h2>
                <p>Automatización de Trámites Laborales</p>
            </div>

            <form action="login_process.php" method="POST" id="form-login">
                
                <div class="input-group">
                    <label for="cedula">Cédula de Identidad</label>
                    <input type="number" id="cedula" name="cedula" placeholder="Ej. 25123456" required>
                </div>

                <div class="input-group">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" name="contrasena" placeholder="********" required>
                </div>

                <button type="submit" id="btn-entrar" class="btn-submit">Ingresar al Sistema</button>
                
            </form>
            
            <div class="login-footer">
                <small>PNF en Informática &copy; 2026</small>
            </div>
        </div>
    </main>

</body>
</html>
